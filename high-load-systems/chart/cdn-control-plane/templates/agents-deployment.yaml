{{- /*
DevOps Lab4

No probes: this container serves no HTTP, and in --watch mode it already
swallows database outages and retries, so restarting it would interrupt a
condition it is designed to ride out.
*/ -}}
{{- if .Values.agents.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cdn.fullname" . }}-agents
  labels:
    {{- include "cdn.labels" (dict "ctx" $ "component" "agents") | nindent 4 }}
spec:
  # One replica is a correctness constraint: the worker rewrites the same
  # heartbeat rows on a timer, so a second copy adds contention and no coverage.
  replicas: 1
  {{- if .Values.agents.progressDeadlineSeconds }}
  # DevOps Lab5 - the same deadline as the API, and for a sharper reason.
  # Argo CD will not begin a new sync while the previous one is still running,
  # and a sync waits for every Deployment it touched to become healthy. With the
  # default 600s, a release that cannot pull its image holds the lock for ten
  # minutes - so the `git revert` that fixes it sits in Git, observed and
  # unapplied, until this Deployment finally admits defeat. Measured: that is
  # exactly what blocked the first recovery run.
  progressDeadlineSeconds: {{ .Values.agents.progressDeadlineSeconds }}
  {{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cdn.selectorLabels" (dict "ctx" $ "component" "agents") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cdn.labels" (dict "ctx" $ "component" "agents") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # DevOps Lab5 - wave 2: nothing here starts until the database (wave 0)
        # is Healthy and the migration (wave 1) has completed.
        "argocd.argoproj.io/sync-wave": "2"
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agents
          image: {{ include "cdn.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - python
            - -m
            - scripts.refresh_fleet
            - --watch
            - {{ .Values.agents.watchIntervalSeconds | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "cdn.fullname" . }}-config
            - secretRef:
                name: {{ include "cdn.secretName" . }}
          resources:
            {{- toYaml .Values.agents.resources | nindent 12 }}
{{- end }}
