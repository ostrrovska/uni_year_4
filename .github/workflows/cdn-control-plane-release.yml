# DevOps Lab 5 - release builds for the CDN Control Plane (high-load-systems/).
#
# Separate from cdn-control-plane-ci.yml on purpose. That workflow filters on
# `paths:`, and GitHub ANDs `paths:` with `tags:` - a tag push carries no
# meaningful path diff, so a release build declared there would be skipped
# exactly when it is needed. Branch and pull-request duties stay in CI; this
# file does one thing, on one event.
#
# GitOps needs tags that name one specific build forever: Argo CD deploys
# whatever Git says, so a tag whose meaning can drift makes Git stop describing
# the cluster. Hence semver tags here and `latest` only in CI.
name: CDN Control Plane release

on:
  push:
    # `cdn-v` prefixed because this is a monorepo and the other courses tag
    # their own work. cdn-v1.2.0 publishes :1.2.0 and :1.2 .
    tags:
      - 'cdn-v*'
  # Lets a release be rebuilt without moving the tag, which is occasionally
  # needed and always better than deleting and re-pushing one.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the cdn-v prefix (e.g. 1.2.0)'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: cdn-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ostrrovska/cdn-control-plane

defaults:
  run:
    working-directory: high-load-systems

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One place decides the version, so the image tag, the APP_VERSION baked
      # into it and the OCI label cannot disagree.
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME#cdn-v}"
          fi
          # A tag like `cdn-vfoo` would otherwise publish an image called :foo
          # and the mistake would only surface as an ImagePullBackOff later.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "not a semantic version: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha

      - uses: docker/setup-buildx-action@v3

      # Built into the local daemon first so Trivy can scan the exact artefact
      # that is about to be published, rather than a rebuild of it.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./high-load-systems
          file: ./high-load-systems/docker/Dockerfile
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            cdn-control-plane:release
          labels: ${{ steps.meta.outputs.labels }}
          # Read back by GET /version, so the running pods can be asked which
          # build they are - the one claim a values file cannot fake.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same policy as CI: report HIGH and CRITICAL, block only on CRITICAL.
      # The current HIGH findings are transitive dependencies without an
      # app-level fix, and a release that cannot be cut is not safer.
      - name: Trivy report (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cdn-control-plane:release
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy gate (block on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cdn-control-plane:release
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Exactly the tags metadata-action computed - never --all-tags, which
      # would also republish whatever `latest` the build cache left in the
      # local daemon and silently move the floating tag backwards.
      - name: Push image
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            echo "pushing $tag"
            docker push "$tag"
          done

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ env.IMAGE }}:${{ steps.version.outputs.version }}"
            echo '```'
            echo
            echo "Deploy it by setting \`image.tag\` in"
            echo "\`high-load-systems/gitops/values/values-minikube.yaml\` and pushing."
          } >> "$GITHUB_STEP_SUMMARY"
