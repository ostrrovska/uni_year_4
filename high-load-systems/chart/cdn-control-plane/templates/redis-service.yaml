{{- /* DevOps Lab4 - ClusterIP only: the cache is never reachable from outside. */ -}}
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cdn.fullname" . }}-redis
  labels:
    {{- include "cdn.labels" (dict "ctx" $ "component" "cache") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cdn.selectorLabels" (dict "ctx" $ "component" "cache") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
