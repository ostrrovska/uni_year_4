# DevOps Lab3
# The single entry point, and the closest analogue to what nginx served on :8080
# under Compose. Needs `minikube addons enable ingress`.
#
# Host-based rather than path-based so the paths the application already exposes
# (/api/v1/..., /health, /docs) are preserved byte-for-byte and no rewrite rule
# is needed - a rewrite would quietly break the OpenAPI schema's server URL.
#
# Reaching it from a Windows host: either `minikube tunnel` (binds :80, needs an
# elevated shell) or a Host header against a port-forwarded controller. The
# NodePort on 30080 stays as the dependency-free path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cdn-api
  namespace: cdn-control-plane
  labels:
    app.kubernetes.io/name: cdn-control-plane
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cdn-control-plane
  annotations:
    # Mirrors proxy.conf: retry the next upstream on a connection-level failure.
    # `non_idempotent` is included for the same reason it is there - heartbeats
    # are append-only, purge acknowledgements are idempotent by composite key,
    # and replica reports upsert, so a retried POST cannot double-apply.
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout non_idempotent http_502 http_503 http_504"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
spec:
  ingressClassName: nginx
  rules:
    - host: cdn.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cdn-api
                port:
                  name: http
