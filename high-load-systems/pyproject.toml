[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdn-control-plane"
version = "0.1.0"
description = "CDN Control Plane API — orchestration and management backend for distributed edge nodes"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # Lab5 - renders docs/lab5-charts/ from the measured JSON. Dev-only, like httpx: the
    # runtime image has no use for it and docker/Dockerfile installs requirements.txt.
    "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# FastAPI's dependency-injection idiom relies on calling Depends()/Query()/etc.
# as an argument default; that is the framework's documented pattern, not a
# mutable-default bug, so B008 is exempted for it instead of disabled globally.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

# scripts/lab5_text.py is a translation catalogue: one string per report sentence, in two
# languages. Most of its over-length lines are Markdown table headers, which cannot be wrapped
# without splitting a table row across string literals, and the rest are single sentences that
# read worse concatenated than long. The file contains no logic for a line-length rule to
# protect, so E501 is lifted there and nowhere else.
[tool.ruff.lint.per-file-ignores]
"scripts/lab5_text.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped loops for both fixtures and tests: the database engine is built once
# per run, and an engine created in one event loop cannot be awaited from another.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
