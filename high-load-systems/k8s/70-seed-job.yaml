# DevOps Lab3
# The demo fleet, matching the `seed` service behind Compose's `demo` profile.
# Kubernetes has no profiles, so it ships as a plain Job: the seed is
# deterministic and idempotent (UUIDv5 keys), which means re-running it against
# a populated database is a no-op rather than a duplicate fleet.
#
# This Job is where the limit of plain manifests shows. Compose could say
# `depends_on: migrate` and be done; Kubernetes has no such edge, so on a cold
# cluster this starts before the schema exists and fails with
# `relation "regions" does not exist` until the migration lands. Retrying is
# the only ordering primitive available here, hence the generous backoffLimit -
# on a first run this really does burn several attempts waiting for PostgreSQL
# to finish initdb and for cdn-migrate to apply the schema.
#
# Lab 4 fixes this properly rather than papering over it: as a Helm hook the
# seed becomes post-install with a hook-weight that puts it strictly after the
# pre-install migration, which is a real ordering guarantee instead of a race
# that retries usually win.
apiVersion: batch/v1
kind: Job
metadata:
  name: cdn-seed
  namespace: cdn-control-plane
  labels:
    app.kubernetes.io/name: cdn-control-plane
    app.kubernetes.io/component: seed
    app.kubernetes.io/part-of: cdn-control-plane
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cdn-control-plane
        app.kubernetes.io/component: seed
        app.kubernetes.io/part-of: cdn-control-plane
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: seed
          image: ghcr.io/ostrrovska/cdn-control-plane:1.0.0
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "scripts.seed"]
          envFrom:
            - configMapRef:
                name: cdn-app-config
            - secretRef:
                name: cdn-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
