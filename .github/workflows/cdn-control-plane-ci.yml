# DevOps Lab 2 - CI for the CDN Control Plane service (high-load-systems/).
# Monorepo: this workflow lives at the repo root and is scoped to high-load-systems/**.
name: CDN Control Plane CI

on:
  push:
    branches: [main]
    paths:
      - 'high-load-systems/**'
      - '.github/workflows/cdn-control-plane-ci.yml'
  pull_request:
    paths:
      - 'high-load-systems/**'
      - '.github/workflows/cdn-control-plane-ci.yml'

permissions:
  contents: read

concurrency:
  group: cdn-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ostrrovska/cdn-control-plane

defaults:
  run:
    working-directory: high-load-systems

jobs:
  # Static analysis - blocking, runs in parallel with `test`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: high-load-systems/pyproject.toml
      - name: Install
        run: pip install -e .[dev]
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  # Build + integration tests against a real PostgreSQL - independent of `lint`.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cdn
          POSTGRES_PASSWORD: cdn
          POSTGRES_DB: cdn_control_plane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdn -d cdn_control_plane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: high-load-systems/pyproject.toml
      - name: Build (install + compile)
        run: |
          pip install -e .[dev]
          python -m compileall app scripts
      - name: Test (pytest, integration)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://cdn:cdn@localhost:5432/cdn_control_plane_test
        run: pytest -q

  # Build the image, scan it, and publish it (push events only).
  docker-image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      # Build once into the local daemon so Trivy can scan it before any push.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./high-load-systems
          file: ./high-load-systems/docker/Dockerfile
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            cdn-control-plane:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Blocking vulnerability scan before publishing.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cdn-control-plane:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Publish only on push to a branch, never on pull requests.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push ${{ env.IMAGE }} --all-tags
