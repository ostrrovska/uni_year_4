# Lab3
proxy_http_version 1.1;
# Required, or the upstream `keepalive` pool is never used.
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# RequestContextMiddleware honours an inbound id, so one id traces a request from the
# balancer log into the instance log.
proxy_set_header X-Request-ID      $request_id;

proxy_connect_timeout 2s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# Passive health check. A connect error, a read timeout or an upstream 5xx makes nginx try
# the next peer inside the same client request, so a dead instance never produces a 5xx at
# the client.
#
# `non_idempotent` also retries POSTs. Without it the guarantee would cover reads only.
# The trade-off is at-least-once delivery, which is safe here specifically: heartbeats are
# append-only, purge acknowledgements are idempotent by composite key, replica reports are
# upserts. Visible cost: a POST /assets whose first attempt committed then died answers 409
# instead of 201.
# Lab5 - http_503 removed, deliberately and with a measurement behind it.
#
# nginx counts every response matching this list as a failed attempt against the peer's
# max_fails. A 503 from this API is not a dead peer: it is the application correctly saying
# "no eligible node" or, under pool exhaustion, "no connection available". Under load those
# arrive in bursts, so every peer crossed max_fails within milliseconds and nginx answered
# "no live upstreams" with a 502 in 0.000 s. Measured on the first Lab 5 run: 20831 of 20866
# responses were 502 at only 10 VUs, and no application latency was sampled at all.
#
# An application-level 503 means *this request cannot be served right now*; a connection reset
# means *this backend is dead*. Sharing one failure counter between them converts a partial,
# recoverable overload into a total outage, and does it fastest exactly when the system is
# already under stress.
#
# The cost of removing it: a 503 is now returned to the client instead of being retried on
# another peer. That is the correct trade. A retry on a pool-exhausted fleet adds load to a
# system that already said it has none to spare, and retrying a 503 is the client's decision to
# make with a backoff, not the balancer's to make immediately.
proxy_next_upstream error timeout non_idempotent http_502 http_504;
proxy_next_upstream_tries 3;
proxy_next_upstream_timeout 5s;
