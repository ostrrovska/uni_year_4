apiVersion: batch/v1
kind: Job
metadata:
  name: cdn-dev-cdn-control-plane-migrate
  labels:
    helm.sh/chart: cdn-control-plane-0.1.0
    app.kubernetes.io/name: cdn-control-plane
    app.kubernetes.io/instance: cdn-dev
    app.kubernetes.io/component: migrate
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cdn-control-plane
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        helm.sh/chart: cdn-control-plane-0.1.0
        app.kubernetes.io/name: cdn-control-plane
        app.kubernetes.io/instance: cdn-dev
        app.kubernetes.io/component: migrate
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: cdn-control-plane
    spec:
      # OnFailure, not Never: on a first install this hook starts while
      # PostgreSQL is still initialising, and a retry is the cheapest wait.
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: "ghcr.io/ostrrovska/cdn-control-plane:1.0.0"
          imagePullPolicy: IfNotPresent
          # alembic.ini and migrations/ ship in the image, and env.py reads
          # DATABASE_URL through app.core.config - nothing else is needed.
          args: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cdn-dev-cdn-control-plane-secrets
                  key: DATABASE_URL
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
