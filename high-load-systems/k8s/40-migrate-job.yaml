# DevOps Lab3
# Schema migration as a one-shot Job, exactly as docker-compose.yml runs it as a
# one-shot service. The reasoning carries over unchanged: if `alembic upgrade
# head` ran from the API container's startup, every one of the N replicas would
# race to apply the same migration to the same database. Running it exactly once
# removes the race instead of hoping the advisory lock absorbs it.
#
# Nothing orders this Job ahead of the api Deployment at apply time - Kubernetes
# has no `depends_on`. It does not need one: the api pods fail their readiness
# probe until the schema exists, so they simply stay out of the Service until
# this Job has finished. Lab 4 turns this same Job into a Helm pre-install /
# pre-upgrade hook, which does give it a true ordering guarantee.
apiVersion: batch/v1
kind: Job
metadata:
  name: cdn-migrate
  namespace: cdn-control-plane
  labels:
    app.kubernetes.io/name: cdn-control-plane
    app.kubernetes.io/component: migrate
    app.kubernetes.io/part-of: cdn-control-plane
spec:
  backoffLimit: 20
  # Keep a finished Job around for a few minutes so `kubectl logs job/cdn-migrate`
  # still works during a demo, then let it clean itself up.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cdn-control-plane
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: cdn-control-plane
    spec:
      # OnFailure, not Never: the Job starts before PostgreSQL is necessarily
      # accepting connections, and a retry is the cheapest way to wait. On a
      # cold cluster initdb alone costs several attempts, which is why the
      # backoff budget above is generous rather than tight.
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: ghcr.io/ostrrovska/cdn-control-plane:1.0.0
          # The two lab tags are loaded straight into the cluster with
          # `minikube image load`, so a registry pull must never be attempted.
          imagePullPolicy: IfNotPresent
          # alembic.ini and migrations/ are already in the image; env.py reads
          # DATABASE_URL through app.core.config, so this needs nothing else.
          args: ["alembic", "upgrade", "head"]
          # No probe of any kind: this container serves no HTTP. The image-level
          # HEALTHCHECK curls :8000, which is why the Compose service disables it.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cdn-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
