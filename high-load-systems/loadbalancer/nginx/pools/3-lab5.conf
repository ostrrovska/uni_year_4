# Lab5
# 3-instance pool for load testing: passive ejection disabled (max_fails=0).
#
# Why this fragment exists, instead of reusing pools/3.conf. nginx's proxy_next_upstream list
# in proxy.conf includes http_503, and pools/3.conf ejects a peer after 3 failures in 5 s. A
# 503 from this API is not a dead peer - it is the application correctly reporting "no eligible
# node" or, under clause 2.5's pool exhaustion, "no connection available". Under load those
# answers arrive in bursts, so all three peers cross max_fails within milliseconds and nginx
# answers "no live upstreams" with a 502 in 0.000 s. Measured on the first Lab 5 smoke run:
# 20831 of 20866 responses were 502 at 10 VUs, and the real application latency behind them was
# never sampled at all.
#
# That is a genuine finding about the shipped configuration and it is reported as one in
# docs/lab5-results.md - an application-level 503 should not be able to eject a healthy
# backend. But it is not the subject of this lab: a load test whose numbers are produced by the
# balancer's health policy measures the balancer, not the system. max_fails=0 tells nginx never
# to mark a peer down, so every request reaches an instance and every latency sample is the
# application's own.
#
# proxy_next_upstream still retries elsewhere, so a genuinely dead peer is still masked from
# the client - see pools/3.conf: failover correctness never depended on max_fails.
# Lab 3's ejection behaviour stays exactly as it was in pools/3.conf and 3-aggressive.conf.
server api1:8000 max_fails=0;
server api2:8000 max_fails=0;
server api3:8000 max_fails=0;
