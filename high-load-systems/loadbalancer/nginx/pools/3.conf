# Lab3
# Three-instance pool.
#
# max_fails=3 within fail_timeout=5s, not max_fails=1. Measured reason: at 64 virtual users a
# saturated single-worker instance resets one queued connection, and with max_fails=1 that one
# reset ejected a healthy peer for the rest of the run - throughput fell from 190 to 110 req/s
# while the client still saw zero errors. A passive check cannot tell "momentarily overloaded"
# from "dead", so it must require a streak. Failover correctness does not depend on this
# number: proxy_next_upstream is what keeps a dead peer from reaching the client, while
# max_fails only decides how long nginx keeps trying it.
#
# pools/3-aggressive.conf keeps the max_fails=1 setting so the two can be compared.
server api1:8000 max_fails=3 fail_timeout=5s;
server api2:8000 max_fails=3 fail_timeout=5s;
server api3:8000 max_fails=3 fail_timeout=5s;
