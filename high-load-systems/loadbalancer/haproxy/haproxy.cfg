# Lab3
# HAProxy: the alternative balancer, and the ACTIVE half of health checking.
#
# nginx open source has no active health checks, so its pool only learns a peer is dead by
# failing a real client request. HAProxy polls GET /health/ready on a timer, so an instance
# whose database connection is broken leaves the pool before a single client request reaches
# it, and rejoins automatically. It also re-resolves Docker DNS and exposes per-server session
# counts - the direct evidence for the Least Connections experiment.
#
# ASCII only: this file is rewritten in place by scripts/lb_switch.ps1.

global
    log stdout format raw local0 info
    maxconn 4096

defaults
    mode    http
    log     global
    option  httplog
    option  dontlognull
    # HAProxy's equivalent of proxy_next_upstream: retry on another server inside the same
    # client request, so an ejected backend never yields a 5xx at the client.
    retries 3
    option  redispatch
    timeout connect 2s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s

# Docker's embedded DNS. Unlike nginx OSS, HAProxy re-resolves on this schedule, so a
# recreated container with a new IP is picked up without a reload.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

frontend fe_cdn
    # 8080, not 80: the official image runs as the unprivileged `haproxy` user.
    bind *:8080
    option forwardfor
    http-request set-header X-Forwarded-Proto http
    http-response set-header X-LB-Algorithm haproxy
    default_backend be_cdn

backend be_cdn
    # Switched by scripts/lb_switch.ps1: roundrobin | leastconn | source.
    balance roundrobin

    # /health/ready rather than /health: a process that is alive but cannot reach PostgreSQL
    # can only return 503s, and liveness would keep it in the pool.
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host cdn
    http-check expect status 200

    # inter 2s with fall 2 / rise 2 bounds detection to ~4s while debouncing one unlucky
    # probe. init-addr lets HAProxy start even when a peer is not up yet.
    default-server check inter 2s fall 2 rise 2 maxconn 200 resolvers docker init-addr last,libc,none

    server api1 api1:8000
    server api2 api2:8000
    server api3 api3:8000

# Read-only stats: a lab instrument on a local network, and the evidence for per-server
# session counts during the Least Connections experiment.
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends
