# DevOps Lab3
# One namespace for the whole control plane. Every object below pins
# `namespace:` explicitly so `kubectl apply -f k8s/` needs no `-n` flag and
# cannot land in whatever context the operator happened to have selected.
apiVersion: v1
kind: Namespace
metadata:
  name: cdn-control-plane
  labels:
    app.kubernetes.io/name: cdn-control-plane
    app.kubernetes.io/part-of: cdn-control-plane
