# DevOps Lab3
# Lab credentials only - the same cdn/cdn pair the Compose stack has always used.
# No password of a real system is stored here, as the assignment requires.
#
# `stringData` rather than base64 `data` on purpose: base64 is encoding, not
# encryption, so writing it out would only make the file harder to review while
# protecting nothing. A real deployment would source this from an external store
# (Sealed Secrets, External Secrets, SOPS) and keep no Secret manifest in git.
#
# DATABASE_URL keeps the `postgresql+asyncpg://` scheme: the application and
# migrations/env.py both build an async engine from it, and a plain
# `postgresql://` URL fails at startup.
apiVersion: v1
kind: Secret
metadata:
  name: cdn-secrets
  namespace: cdn-control-plane
  labels:
    app.kubernetes.io/name: cdn-control-plane
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: cdn-control-plane
type: Opaque
stringData:
  POSTGRES_PASSWORD: "cdn"
  DATABASE_URL: "postgresql+asyncpg://cdn:cdn@cdn-postgres:5432/cdn_control_plane"
