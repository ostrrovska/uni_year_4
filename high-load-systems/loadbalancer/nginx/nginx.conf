# Lab3
# One worker, deliberately. nginx keeps balancing state per worker: with `auto` (14 workers
# here) each worker round-robins over the pool independently, so a sequential client lands on
# peer #1 every time and least_conn compares only the connections that one worker owns. A
# single worker makes the measured distribution reflect the algorithm instead of the worker
# count, and one worker serves far more than this lab's load.
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $upstream_addr lists every peer tried, so a passive ejection and its retry show up
    # on one line as "api2:8000, api1:8000".
    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr upstream_status=$upstream_status '
                  'instance=$upstream_http_x_instance_id cache=$upstream_http_x_cache '
                  'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log lb;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Written by switch.sh from one algorithms/ fragment plus one pools/ fragment.
    # Defines `upstream cdn_api` and the $lb_algorithm map.
    include /etc/nginx/upstream.conf;

    server {
        listen 80 default_server;
        server_name _;

        add_header X-LB-Algorithm $lb_algorithm always;

        # The dashboard. Same-origin with the API, so JS can read X-Instance-ID and
        # X-Cache without any CORS exposure header.
        location / {
            root /usr/share/nginx/html;
            index index.html;
            add_header Cache-Control "no-store" always;
            add_header X-LB-Algorithm $lb_algorithm always;
        }

        # Answers without touching the pool, so "the balancer is down" can be told apart
        # from "every backend is down".
        location = /lb-health {
            access_log off;
            default_type text/plain;
            return 200 "lb ok\n";
        }

        # Active algorithm and pool size, rewritten by every switch.
        location = /lb-status {
            access_log off;
            default_type application/json;
            alias /etc/nginx/lb-status.json;
        }

        # HAProxy's per-server stats as CSV. Resolved at request time through a variable
        # so nginx still starts when haproxy is absent.
        location = /lb-stats {
            access_log off;
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $haproxy_stats "http://haproxy:8404/;csv";
            proxy_pass $haproxy_stats;
        }

        # Lab5 - the "Run live" button on /lab5-report.html. scripts/lab5_live.py runs on the
        # HOST, not in a container, because it shells out to the host's k6 - and k6 staying off
        # the Docker network is the point: clause 2.2 asks for the load generator to be isolated
        # from the system under test, and a generator sharing the SUT's CPU limits is not.
        #
        # Proxied rather than called cross-origin so the page stays same-origin with everything
        # else it talks to. Resolved at request time through a variable, exactly as /lb-stats
        # does for haproxy, so nginx still starts when the runner is absent - a missing defence
        # prop must not be able to take the dashboard down with it.
        # A regex location with a named capture, not a prefix one: proxy_pass to a variable
        # does not append the request URI, so the remainder of the path has to be captured and
        # reassembled by hand - and $1 from a `rewrite ... break` is not dependable here.
        location ~ ^/lab5/(?<lab5path>.*)$ {
            access_log off;
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $lab5_runner "http://host.docker.internal:8099";
            proxy_pass $lab5_runner/$lab5path$is_args$args;
            # Short timeouts: if the runner is not listening the page must find out in two
            # seconds and fall back to printing the command, not hang on a spinner.
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
        }

        location /api/ {
            include /etc/nginx/proxy.conf;
            proxy_pass http://cdn_api;
        }

        location /health {
            include /etc/nginx/proxy.conf;
            proxy_pass http://cdn_api;
        }

        location /docs {
            include /etc/nginx/proxy.conf;
            proxy_pass http://cdn_api;
        }

        location /openapi.json {
            include /etc/nginx/proxy.conf;
            proxy_pass http://cdn_api;
        }
    }
}
