# Lab3
# Least Connections — the peer with the fewest active connections wins, so a slow peer stops
# receiving work as soon as its requests start piling up.
# The method must come before `keepalive`.
map $host $lb_algorithm { default "least-conn"; }

upstream cdn_api {
    least_conn;
    include /etc/nginx/pool.conf;
    keepalive 32;
}
