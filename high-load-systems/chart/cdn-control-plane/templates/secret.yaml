{{- /*
DevOps Lab4

No credential is written in this template. Both values come from .Values, so a
real deployment overrides them with `--set` from a CI secret or a secret store
and never commits one. The chart's defaults are the lab's cdn/cdn pair.

DevOps Lab5: when existingSecret names a Secret created outside the chart, this
whole file renders to nothing and the workloads read that Secret instead. Argo
CD has no `--set`, so this is how the GitOps path keeps the credential out of
Git - see gitops/values/values-minikube.yaml.
*/ -}}
{{ if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cdn.secretName" . }}
  labels:
    {{- include "cdn.labels" (dict "ctx" $ "component" "config") | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "cdn.databaseUrl" . | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  {{- end }}
{{- end }}
