{{- /*
DevOps Lab4, amended in Lab6.

Rendered only when rollout.enabled is false. With it true, templates/rollout.yaml
renders an Argo Rollout from the same pod template instead. The guard is not
optional: a Deployment and a Rollout sharing one selector means two controllers
driving the same pods, each undoing the other.
*/ -}}
{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cdn.fullname" . }}-api
  labels:
    {{- include "cdn.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  {{- if .Values.api.progressDeadlineSeconds }}
  # DevOps Lab5 - how long a rollout may make no progress before Kubernetes
  # marks the Deployment failed, which is what Argo CD reports as Degraded.
  # The default is 600s; under GitOps that is ten minutes of a broken release
  # looking merely "Progressing" before anyone is told it is broken.
  progressDeadlineSeconds: {{ .Values.api.progressDeadlineSeconds }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- toYaml .Values.api.rollingUpdate | nindent 6 }}
  selector:
    matchLabels:
      {{- include "cdn.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    {{- include "cdn.apiPodTemplate" . | nindent 4 }}
{{- end }}
