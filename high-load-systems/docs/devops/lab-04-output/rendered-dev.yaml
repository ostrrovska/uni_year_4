# Source: cdn-control-plane/templates/tests/test-api-ready.yaml
apiVersion: v1
kind: Pod
metadata:
  name: cdn-dev-cdn-control-plane-test-api-ready
  labels:
    helm.sh/chart: cdn-control-plane-0.1.0
    app.kubernetes.io/name: cdn-control-plane
    app.kubernetes.io/instance: cdn-dev
    app.kubernetes.io/component: test
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cdn-control-plane
  annotations:
    "helm.sh/hook": test
    # Removed once it passes, so `helm uninstall` leaves an empty namespace;
    # a failed test pod is kept, because that is when its logs matter.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: test-api-ready
      image: "ghcr.io/ostrrovska/cdn-control-plane:1.0.0"
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          base="http://cdn-dev-cdn-control-plane-api:80"

          echo "GET $base/health"
          curl --fail --silent --show-error "$base/health"
          echo

          echo "GET $base/health/ready"
          curl --fail --silent --show-error "$base/health/ready"
          echo

          echo "GET $base/api/v1/stats/network"
          curl --fail --silent --show-error "$base/api/v1/stats/network" > /dev/null
          echo "ok"
