[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# sqlalchemy.url is intentionally absent: migrations/env.py reads DATABASE_URL through
# app.core.config, so the application and its migrations can never point at different
# databases — a class of bug that only shows up in production.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
