# Source: cdn-control-plane/templates/postgresql-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdn-dev-cdn-control-plane-postgresql
  labels:
    helm.sh/chart: cdn-control-plane-0.1.0
    app.kubernetes.io/name: cdn-control-plane
    app.kubernetes.io/instance: cdn-dev
    app.kubernetes.io/component: database
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cdn-control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cdn-control-plane
      app.kubernetes.io/instance: cdn-dev
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        helm.sh/chart: cdn-control-plane-0.1.0
        app.kubernetes.io/name: cdn-control-plane
        app.kubernetes.io/instance: cdn-dev
        app.kubernetes.io/component: database
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: cdn-control-plane
    spec:
      containers:
        - name: postgresql
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "cdn"
            - name: POSTGRES_DB
              value: "cdn_control_plane"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cdn-dev-cdn-control-plane-secrets
                  key: POSTGRES_PASSWORD
            # A subdirectory, so a provisioner that leaves lost+found in the
            # mount root cannot make initdb refuse the data directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command: ["pg_isready","-U","cdn","-d","cdn_control_plane"]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: ["pg_isready","-U","cdn","-d","cdn_control_plane"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready","-U","cdn","-d","cdn_control_plane"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              cpu: 500m
              memory: 384Mi
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cdn-dev-cdn-control-plane-postgresql
