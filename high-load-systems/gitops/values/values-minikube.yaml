# DevOps Lab5
# The desired state of the CDN Control Plane on the local minikube cluster.
#
# Nothing applies this file by hand. Argo CD reads it straight from Git
# (gitops/argocd-apps/cdn-control-plane.yaml names it) and reconciles the
# cluster against it, so every line here is a fact about the cluster rather than
# an argument to a command somebody has to remember to type.
#
# It is the Lab 4 development overlay with three changes, each forced by the move
# to GitOps:
#
#   1. image.tag is pinned to an exact published version. Lab 4 could side-load
#      an image with `minikube image load`; a GitOps cluster pulls what Git says
#      and nothing else, so the tag has to name a real artefact in GHCR.
#   2. existingSecret replaces the in-chart password. There is no `--set` in a
#      GitOps flow - Argo CD renders the chart itself - so a committed values
#      file is the only input, and a committed values file must not hold a
#      credential.
#   3. The node port moves again, to 30082, so this release can run beside the
#      Lab 3 manifests (30080) and the Lab 4 release (30081).

image:
  # The one line that releases a new version. Changing it, committing and pushing
  # is the entire deployment procedure in Lab 5 - see docs/devops/lab-05.md Â§5.
  # Must be an immutable tag: `latest` would make Git stop describing the cluster,
  # because the same commit would mean a different image on different days.
  tag: "1.6.0"
  # Always, not IfNotPresent. Under GitOps a pod may be rescheduled onto a node
  # that already holds a stale layer under the same name; Always makes the
  # registry the authority. It also makes a wrong tag fail loudly and quickly
  # with ImagePullBackOff, which is what the Degraded demonstration needs.
  pullPolicy: Always

# Created in the cluster out of band, never in Git:
#   kubectl create secret generic cdn-db -n cdn-gitops \
#     --from-literal=POSTGRES_PASSWORD='<password>' \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://cdn:<password>@cdn-cdn-control-plane-postgresql:5432/cdn_control_plane'
# The chart then renders no Secret of its own - see templates/secret.yaml.
existingSecret: cdn-db

config:
  appEnv: development
  logLevel: INFO

api:
  # DevOps Lab6 - five, not one. Without a service mesh, Argo Rollouts expresses
  # a canary weight as a share of the replica count, and one Service fronts both
  # versions. Five replicas make setWeight: 20 mean exactly one canary pod, so
  # roughly every fifth response carries the new version - which is the thing
  # the demonstration has to actually show, not assert.
  replicaCount: 5
  # 120s rather than the 600s default: point 6b of the assignment puts a tag in
  # Git that cannot be pulled, and the release has to be *seen* to go Degraded.
  # Ten minutes of "Progressing" would be a correct status and a useless one.
  progressDeadlineSeconds: 120
  service:
    type: NodePort
    nodePort: 30082
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# On: an empty control plane makes a poor demonstration, and the seed hook is
# idempotent, so Argo CD re-running it on a sync changes nothing.
# DevOps Lab6 - progressive delivery, variant (a): canary.
#
# The chart supports blue-green too; switching is a values change and nothing
# else, because templates/rollout.yaml passes this block through verbatim. The
# blue-green equivalent is kept at the bottom of this file, commented out.
rollout:
  enabled: true
  strategy:
    canary:
      steps:
        # 20% - one pod of five. Then stop and wait for a human: `pause: {}`
        # with no duration is the step that makes this progressive delivery
        # rather than a slower rolling update. Argo CD reports the application
        # as Suspended while it waits.
        - setWeight: 20
        - pause: {}
        # Past the manual gate the rest is automatic, on a timer.
        - setWeight: 60
        - pause: {duration: 30s}
        - setWeight: 80
        - pause: {duration: 30s}

# The agents Deployment needs the deadline as much as the API does: a sync waits
# for every Deployment it touched, and Argo CD starts no new sync until the
# previous one ends. Without this, a `git revert` of a bad tag waits ten minutes
# for the old sync to give up before it can be applied.
agents:
  progressDeadlineSeconds: 120

seed:
  enabled: true

postgresql:
  # The password is not here. auth.username and auth.database are not secret and
  # the container needs them as plain environment variables.
  auth:
    username: cdn
    database: cdn_control_plane
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi

redis:
  maxmemory: 64mb

# Off: minikube has no ingress controller enabled by default, and a NodePort
# keeps the demonstration to one moving part.
ingress:
  enabled: false

# ---------------------------------------------------------------------------
# Variant (b), blue-green - the same chart, a different strategy block. Swap it
# for the canary block above and lower replicaCount to 4; nothing else changes,
# and templates/api-service-preview.yaml starts rendering on its own.
#
# rollout:
#   enabled: true
#   strategy:
#     blueGreen:
#       activeService: cdn-cdn-control-plane-api
#       previewService: cdn-cdn-control-plane-api-preview
#       # False on purpose: the point of blue-green here is that the new version
#       # is fully up and reachable on the preview Service while every user is
#       # still served by the old one, until a human promotes it.
#       autoPromotionEnabled: false
#       scaleDownDelaySeconds: 30
