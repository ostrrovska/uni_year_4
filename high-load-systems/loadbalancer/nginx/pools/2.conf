# Lab3
# Two-instance pool for the scale-out experiment. nginx refuses to start on an unresolvable
# upstream name, so the pool must name only the instances that are actually running.
# See pools/3.conf for why max_fails is 3 rather than 1.
server api1:8000 max_fails=3 fail_timeout=5s;
server api2:8000 max_fails=3 fail_timeout=5s;
