# Source: cdn-control-plane/templates/api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdn-dev-cdn-control-plane-api
  labels:
    helm.sh/chart: cdn-control-plane-0.1.0
    app.kubernetes.io/name: cdn-control-plane
    app.kubernetes.io/instance: cdn-dev
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cdn-control-plane
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cdn-control-plane
      app.kubernetes.io/instance: cdn-dev
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        helm.sh/chart: cdn-control-plane-0.1.0
        app.kubernetes.io/name: cdn-control-plane
        app.kubernetes.io/instance: cdn-dev
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: cdn-control-plane
      annotations:
        # Roll the pods when configuration changes but the image does not.
        # Without this, an upgrade that only edits the ConfigMap would leave
        # every replica running on the old values indefinitely.
        checksum/config: a2a92180db3aafd16d1471b29abd4e5176e9e610444b97af3b22c649209d1efe
        checksum/secret: c267fbd970bb31380392e4a60ad43afccfe47f125f5e5e704d585576c92f3f7c
    spec:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: "ghcr.io/ostrrovska/cdn-control-plane:1.0.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # See k8s/50-api-deployment.yaml: endpoint removal and SIGTERM race,
          # and without this a rolling update drops a request or two. The sleep
          # delays SIGTERM while the removal propagates; it does not extend the
          # shutdown itself.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          envFrom:
            - configMapRef:
                name: cdn-dev-cdn-control-plane-config
            - secretRef:
                name: cdn-dev-cdn-control-plane-secrets
          # INSTANCE_ID stays unset so the app falls back to the hostname, which
          # here is the pod name - making /health self-identifying.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Reproduces the HAProxy check: inter 2s, fall 2, rise 2.
          # failureThreshold is 2 rather than 1 on the strength of a measured
          # run - one-strike ejection cost 190 to 110 req/s, because a
          # momentarily saturated instance is not a dead one.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 2
          # The schema is applied by the migrate hook, so first boot gets a
          # generous window without loosening the steady-state probes above.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 30
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
