{{- /* DevOps Lab4 - optional, as the task asks: a PVC only when it is wanted. */ -}}
{{- if and .Values.postgresql.enabled .Values.postgresql.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cdn.fullname" . }}-postgresql
  labels:
    {{- include "cdn.labels" (dict "ctx" $ "component" "database") | nindent 4 }}
  annotations:
    # Survive `helm uninstall` so a reinstall keeps its data. Deleting it is a
    # deliberate act: kubectl delete pvc.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.postgresql.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size | quote }}
{{- end }}
