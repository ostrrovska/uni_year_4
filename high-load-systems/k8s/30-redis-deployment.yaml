# DevOps Lab3
# The Lab 4 shared cache. No PVC, deliberately: the same argument the Compose
# file makes - persistence would spend I/O preserving data whose whole value is
# being cheap and disposable, and a cache that survives a restart full of stale
# entries is worse than a cold one.
#
# allkeys-lru rather than allkeys-lfu because this workload is recency-skewed:
# a release makes one path hot for minutes and then it cools, so LFU would keep
# long-dead popular paths resident while evicting a path that just became hot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdn-redis
  namespace: cdn-control-plane
  labels:
    app.kubernetes.io/name: cdn-control-plane
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: cdn-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cdn-control-plane
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cdn-control-plane
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: cdn-control-plane
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 192mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            # The limit sits above maxmemory so Redis evicts by its own policy
            # rather than being OOM-killed by the kubelet mid-eviction.
            limits:
              cpu: 500m
              memory: 256Mi
