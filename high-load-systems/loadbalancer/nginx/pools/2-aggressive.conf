# Lab3
# Two-instance pool with the aggressive passive check. Two instances at 64 virtual users is
# the load that first exposed the behaviour: one connection reset from a saturated peer is
# enough for max_fails=1 to eject it, and the survivor then carries the whole pool.
server api1:8000 max_fails=1 fail_timeout=10s;
server api2:8000 max_fails=1 fail_timeout=10s;
