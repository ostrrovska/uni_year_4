# Lab3
# Four-instance pool: the "3+" configuration of the scale-out experiment, and the run that
# tests the three-instance prediction that PostgreSQL saturates at about four instances.
# See pools/3.conf for why max_fails is 3 rather than 1.
server api1:8000 max_fails=3 fail_timeout=5s;
server api2:8000 max_fails=3 fail_timeout=5s;
server api3:8000 max_fails=3 fail_timeout=5s;
server api4:8000 max_fails=3 fail_timeout=5s;
