# DevOps Lab3
# Stands in for the agents that run on real edge servers. Without it a seeded
# fleet falls silent, every node ages past HEARTBEAT_STALE_AFTER_SECONDS and
# routing correctly reports that no node is reachable - the missing piece being
# the agents, not the control plane.
#
# One replica, and that is a correctness constraint rather than a resource
# decision: the worker rewrites the same heartbeat rows on a timer, so a second
# copy would add contention and no coverage.
#
# It reaches PostgreSQL directly rather than over HTTP, and it needs the same
# cache configuration as the API: it mutates node status in process, so without
# Redis it would leave cached routing answers still listing an overloaded node
# as eligible.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdn-agents
  namespace: cdn-control-plane
  labels:
    app.kubernetes.io/name: cdn-control-plane
    app.kubernetes.io/component: agents
    app.kubernetes.io/part-of: cdn-control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cdn-control-plane
      app.kubernetes.io/component: agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cdn-control-plane
        app.kubernetes.io/component: agents
        app.kubernetes.io/part-of: cdn-control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: agents
          image: ghcr.io/ostrrovska/cdn-control-plane:1.0.0
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "scripts.refresh_fleet", "--watch", "10"]
          # No probes. This container serves no HTTP, and in --watch mode it
          # already swallows database outages and retries, so it must not be
          # restarted for a condition it is designed to ride out.
          envFrom:
            - configMapRef:
                name: cdn-app-config
            - secretRef:
                name: cdn-secrets
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
