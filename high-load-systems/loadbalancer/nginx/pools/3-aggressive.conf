# Lab3
# Same three-instance pool with the aggressive passive check: one failure ejects a peer for a
# full 10 seconds. Kept so the experiment can show what that costs under load - a single
# connection reset from a busy instance removes it from the pool, the survivors absorb its
# share, and the pool degrades toward one node without a single client-visible error.
server api1:8000 max_fails=1 fail_timeout=10s;
server api2:8000 max_fails=1 fail_timeout=10s;
server api3:8000 max_fails=1 fail_timeout=10s;
