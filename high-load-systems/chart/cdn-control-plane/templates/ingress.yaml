{{- /* DevOps Lab4 - optional, per the task's enabled-flag requirement. */ -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cdn.fullname" . }}-api
  labels:
    {{- include "cdn.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cdn.fullname" . }}-api
                port:
                  name: http
{{- end }}
