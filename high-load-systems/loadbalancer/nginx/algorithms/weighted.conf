# Lab3
# Weighted Round Robin — heterogeneous infrastructure: api1 treated as a 5x machine, api2 3x,
# api3 1x. Expected share 55.6 / 33.3 / 11.1 %.
# Does not include pool.conf, because weights live on the server lines; only meaningful with
# the full three-instance pool.
map $host $lb_algorithm { default "weighted"; }

upstream cdn_api {
    server api1:8000 weight=5 max_fails=3 fail_timeout=5s;
    server api2:8000 weight=3 max_fails=3 fail_timeout=5s;
    server api3:8000 weight=1 max_fails=3 fail_timeout=5s;
    keepalive 32;
}
