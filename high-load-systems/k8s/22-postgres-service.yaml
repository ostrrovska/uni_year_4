# DevOps Lab3
# ClusterIP: the database is reachable from the application pods and from
# nowhere else. Compose publishes 5434 on the host for pgAdmin and psql; inside
# a cluster that would be a gratuitous hole, and `kubectl port-forward` covers
# the same need on demand without leaving a listener open.
apiVersion: v1
kind: Service
metadata:
  name: cdn-postgres
  namespace: cdn-control-plane
  labels:
    app.kubernetes.io/name: cdn-control-plane
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cdn-control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cdn-control-plane
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
