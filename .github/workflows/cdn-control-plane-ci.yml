# DevOps Lab 2 - CI for the CDN Control Plane service (high-load-systems/).
# Monorepo: this workflow lives at the repo root and is scoped to high-load-systems/**.
name: CDN Control Plane CI

on:
  push:
    branches: [main]
    paths:
      - 'high-load-systems/**'
      - '.github/workflows/cdn-control-plane-ci.yml'
    # DevOps Lab5 - a release tag publishes an immutable, semver-tagged image.
    # GitOps needs a tag that names one specific build forever: Argo CD deploys
    # whatever Git says, so if the tag's meaning can change, Git stops describing
    # the cluster. `cdn-v` prefixes it because this is a monorepo and the other
    # courses tag their own work.
    tags:
      - 'cdn-v*'
  pull_request:
    paths:
      - 'high-load-systems/**'
      - '.github/workflows/cdn-control-plane-ci.yml'

permissions:
  contents: read

concurrency:
  group: cdn-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ostrrovska/cdn-control-plane

defaults:
  run:
    working-directory: high-load-systems

jobs:
  # Static analysis - blocking, runs in parallel with `test`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: high-load-systems/pyproject.toml
      - name: Install
        run: pip install -e .[dev]
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  # Build + integration tests against a real PostgreSQL - independent of `lint`.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cdn
          POSTGRES_PASSWORD: cdn
          POSTGRES_DB: cdn_control_plane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdn -d cdn_control_plane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: high-load-systems/pyproject.toml
      - name: Build (install + compile)
        run: |
          pip install -e .[dev]
          python -m compileall app scripts
      - name: Test (pytest, integration)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://cdn:cdn@localhost:5432/cdn_control_plane_test
        run: pytest -q

  # Build the image, scan it, and publish it (push events only).
  docker-image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            # cdn-v1.2.0 -> :1.2.0 and :1.2 . The bare version is what
            # gitops/values/values-minikube.yaml pins.
            type=semver,pattern={{version}},prefix=
            type=semver,pattern={{major}}.{{minor}},prefix=

      - uses: docker/setup-buildx-action@v3

      # Build once into the local daemon so Trivy can scan it before any push.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./high-load-systems
          file: ./high-load-systems/docker/Dockerfile
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            cdn-control-plane:ci
          labels: ${{ steps.meta.outputs.labels }}
          # DevOps Lab5 - baked into the image and served by /version, so a
          # GitOps rollout can be verified by asking the pods rather than by
          # trusting the manifest that asked for them.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Vulnerability scan. Report HIGH+CRITICAL for visibility, but only block the
      # publish on CRITICAL: the current HIGH findings are transitive dependencies
      # (msgpack, setuptools, urllib3) without an app-level fix.
      - name: Trivy report (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cdn-control-plane:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy gate (block on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cdn-control-plane:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Publish only on push to a branch, never on pull requests.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push exactly the tags metadata-action computed for this event, rather
      # than --all-tags: on a tag build the local daemon still holds `latest`
      # from the cache, and --all-tags would republish it and silently move the
      # floating tag backwards.
      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            case "$tag" in
              cdn-control-plane:ci) continue ;;
            esac
            docker push "$tag"
          done
