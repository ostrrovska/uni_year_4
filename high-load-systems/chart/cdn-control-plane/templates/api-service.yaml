{{- /* DevOps Lab4 */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cdn.fullname" . }}-api
  labels:
    {{- include "cdn.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "cdn.selectorLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      # A fixed nodePort is only safe for one release at a time; a second
      # concurrent install must override it or switch to ClusterIP.
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
